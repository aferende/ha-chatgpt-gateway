name: Publish v0.6.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'aferende/ha-chatgpt-gateway'
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.6.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: 5e8efd2ab9b1ff2c5346857a4c0d6a40ea4ed3d0
        run: |
          set -euo pipefail

          if gh api "repos/$REPO/releases/tags/v0.6.0" >/dev/null 2>&1; then
            echo "v0.6.0 already exists; nothing to do."
            exit 0
          fi

          if ! gh api "repos/$REPO/git/ref/tags/v0.6.0" >/dev/null 2>&1; then
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref='refs/tags/v0.6.0' \
              -f sha="$RELEASE_SHA"
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## Added

          - Opt-in, policy-filtered Home Assistant Logbook access with bounded time ranges, response limits, and state minimization.
          - Optional Home Assistant Diagnostics companion and gateway route for bounded, redacted Home Assistant Core warning/error records with traceback context.
          - Structured, privacy-preserving request audit events with server-generated request IDs and HMAC-based pseudonymous client/peer fingerprints.
          - Gateway-to-Diagnostics request correlation plus forensic observability, privacy, retention, and incident-analysis documentation.

          ## Security

          - Separate failed-authentication, authenticated, and service-call rate-limit buckets.
          - Bounded process-local rate-limit maps and distinct legacy/read/write credential identities.
          - Raw IP logging remains disabled by default; optional persistent audit HMAC keys support stable pseudonyms across restarts.
          - Fastify runtime dependency floor raised to 5.12.5.
          - Node.js requirement aligned to 22.12.0+.

          ## Fixed

          - ISO-8601 History and Logbook timestamps now safely accept encoded or narrowly repaired raw positive UTC offsets.
          - Legacy, read, and write credentials retain distinct audit identities and independent authenticated/service quotas.
          - Diagnostics lifecycle and request-audit logs are compact and human-readable.
          EOF

          gh release create v0.6.0 \
            --repo "$REPO" \
            --target "$RELEASE_SHA" \
            --title "v0.6.0 — Diagnostics and forensic observability" \
            --notes-file /tmp/release-notes.md
