# Standard Keycloak authentication stack. Start it with --profile oauth.
services:
  oauth-db:
    profiles: [oauth]
    image: '${OAUTH_POSTGRES_IMAGE:-postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24}'
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: '${OAUTH_DB_PASSWORD:?Set a strong database password}'
    volumes:
      - oauth-db:/var/lib/postgresql/data
    networks: [oauth]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak -d keycloak']
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      com.centurylinklabs.watchtower.enable: 'false'

  oauth:
    profiles: [oauth]
    image: '${OAUTH_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc}'
    restart: unless-stopped
    command:
      [
        'start',
        '--http-enabled=true',
        '--proxy-headers=xforwarded',
        '--features=resource-indicators',
      ]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://oauth-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: '${OAUTH_DB_PASSWORD:?Set a strong database password}'
      KC_HOSTNAME: '${OAUTH_PUBLIC_URL:?Set the HTTPS OAuth provider URL}'
      KC_HTTP_RELATIVE_PATH: /oauth
      KC_BOOTSTRAP_ADMIN_USERNAME: '${OAUTH_ADMIN_USER:-gateway-admin}'
      KC_BOOTSTRAP_ADMIN_PASSWORD: '${OAUTH_ADMIN_PASSWORD:?Set a strong bootstrap password}'
    ports:
      - '127.0.0.1:${OAUTH_PORT:-8790}:8080'
    depends_on:
      oauth-db:
        condition: service_healthy
    networks: [oauth]
    security_opt: [no-new-privileges:true]
    labels:
      com.centurylinklabs.watchtower.enable: 'false'

networks:
  oauth:

volumes:
  oauth-db:
