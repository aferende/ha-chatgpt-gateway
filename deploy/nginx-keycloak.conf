# Include inside the existing HTTPS gateway server block.
# Keycloak binds to loopback, with KC_HTTP_RELATIVE_PATH=/oauth.
location ^~ /oauth/realms/home-assistant/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    # Keycloak reauthorization can send large Set-Cookie/Location headers.
    proxy_buffer_size 32k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 64k;
    proxy_intercept_errors off;
    # Never persist raw OAuth query strings in proxy error/access logs.
    # Use Keycloak events and gateway audit logs for authentication diagnostics.
    access_log off;
    error_log /dev/null;
}
location ^~ /oauth/resources/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /.well-known/oauth-authorization-server/oauth/realms/home-assistant {
    proxy_pass http://127.0.0.1:8790/oauth/realms/home-assistant/.well-known/openid-configuration;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /oauth/ {
    return 403;
}
