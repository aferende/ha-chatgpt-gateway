name: HA ChatGPT Diagnostics
version: 0.1.10
slug: ha_chatgpt_diagnostics
description: Bounded, read-only Home Assistant Core error logs for HA ChatGPT Gateway
url: https://github.com/aferende/ha-chatgpt-gateway/tree/main/ha-chatgpt-diagnostics
arch:
  - aarch64
  - amd64
startup: services
init: false
hassio_api: true
hassio_role: homeassistant
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Diagnostics API for the trusted gateway host only
options:
  diagnostics_token: null
schema:
  diagnostics_token: match(^[A-Fa-f0-9]{64}$)
